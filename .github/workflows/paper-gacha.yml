name: Paper Gacha

on:
  pull_request:
    paths:
      - "paper_gacha.py"
      - "requirements.txt"
      - ".github/workflows/paper-gacha.yml"
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC is 09:00 in JST (UTC+9).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Select papers without posting to Bluesky"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      PAPER_GACHA_EXPERTISE: ${{ vars.PAPER_GACHA_EXPERTISE }}
      PAPER_GACHA_RELATED: ${{ vars.PAPER_GACHA_RELATED }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      # Pull requests are always safe previews: never post or update history.
      PAPER_GACHA_DRY_RUN: ${{ github.event_name == 'pull_request' && 'true' || inputs.dry_run || 'false' }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: embedding-model-${{ runner.os }}-all-MiniLM-L6-v2
      - run: pip install -r requirements.txt
      - run: python paper_gacha.py
      - name: Save posted-paper history
        # Manual runs are previews or experiments. Only the daily schedule
        # establishes the durable deduplication history.
        if: ${{ github.event_name == 'schedule' }}
        run: |
          git config user.name "paper-gacha[bot]"
          git config user.email "paper-gacha[bot]@users.noreply.github.com"
          git add data/posted_papers.json
          git diff --cached --quiet || git commit -m "chore: record posted papers"
          git push
